<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1 id="title">Checking your order…</h1>
    <p id="message"></p>
    <p><a href="/">Back to the shop</a></p>
  </main>
  <script type="module">
    const id = new URLSearchParams(location.search).get('session_id');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    try {
      const res = await fetch(`/api/checkout-sessions/${encodeURIComponent(id ?? '')}`);
      const order = await res.json();
      if (!res.ok) throw new Error(order.error);
      if (order.paymentStatus === 'paid' || order.paymentStatus === 'no_payment_required') {
        title.textContent = 'Thank you for your order!';
        message.textContent = `A confirmation is on its way to ${order.email ?? 'your email'}.`;
      } else {
        title.textContent = 'Order received';
        message.textContent = 'Your payment is processing. We will email you as soon as it is confirmed.';
      }
    } catch (err) {
      title.textContent = 'We could not find that order';
      message.textContent = err.message;
    }
  </script>
</body>
</html>
