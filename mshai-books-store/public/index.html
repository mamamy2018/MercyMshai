<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mshai Books Shop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Mshai Books</h1>
      <p>Practical Books. Useful Ideas. Better Ways Forward.</p>
    </header>
    <div id="notice"></div>
    <section class="grid" id="books" aria-label="Books"></section>
    <section class="cart" aria-label="Cart">
      <h2>Your cart</h2>
      <ul id="cart-items"></ul>
      <p id="cart-total"></p>
      <button id="checkout" disabled>Checkout</button>
      <p class="error" id="error" role="alert"></p>
    </section>
  </main>
  <script src="/shop.js" type="module"></script>
</body>
</html>
